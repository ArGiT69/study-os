{% extends "base.html" %}

{% block title %}
Study Timer · Study OS
{% endblock %}

{% block content %}

<header class="page-header">
    <div>
        <div class="eyebrow">
            STUDY OS / TIMER
        </div>

        <h1>
            Study Timer
        </h1>

        <p>
            Focus. Study. Repeat.
        </p>
    </div>
</header>


<section class="timer-panel">

    <div class="timer-display" id="timerDisplay">
        00:00:00
    </div>

    <div class="timer-label">
        FOCUS TIME
    </div>


    <div class="timer-controls">

        <button type="button" class="primary-button timer-button" id="startButton">
            Start
        </button>

        <button type="button" class="secondary-button timer-button" id="pauseButton">
            Pause
        </button>

        <button type="button" class="secondary-button timer-button" id="resetButton">
            Reset
        </button>

    </div>

</section>


<section class="panel">

    <h2>
        Study session
    </h2>

    <form id="sessionForm">

        <div class="form-group">

            <label for="subject">
                Subject
            </label>

            <select id="subject">

                <option value="">
                    No subject
                </option>

                {% for subject in subjects %}

                <option value="{{ subject.id }}">
                    {{ subject.name }}
                </option>

                {% endfor %}

            </select>
            {% include "add_subject.html" %}
        </div>


        <div class="form-group">

            <label for="notes">
                Notes
            </label>

            <input type="text" id="notes" placeholder="What did you study?">

        </div>

    </form>

</section>


<style>
    .timer-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        padding: 70px 30px;
        margin-bottom: 24px;

        border-radius: 24px;
    }


    .timer-display {
        font-family:
            "Courier New",
            Courier,
            monospace;

        font-size: clamp(70px, 12vw, 150px);

        font-weight: 700;

        letter-spacing: 8px;

        line-height: 1;

        font-variant-numeric:
            tabular-nums;

        text-align: center;

        white-space: nowrap;
    }


    .timer-label {
        margin-top: 25px;

        font-size: 13px;

        letter-spacing: 4px;

        opacity: 0.55;
    }


    .timer-controls {
        display: flex;

        gap: 12px;

        margin-top: 40px;

        flex-wrap: wrap;

        justify-content: center;
    }


    .timer-button {
        min-width: 110px;
    }


    .form-group {
        margin-bottom: 18px;
    }


    .form-group label {
        display: block;

        margin-bottom: 8px;

        font-size: 14px;

        font-weight: 600;
    }


    .form-group input,
    .form-group select {
        width: 100%;

        box-sizing: border-box;
    }


    @media (max-width: 600px) {

        .timer-panel {
            padding: 50px 15px;
        }

        .timer-display {
            font-size: 55px;
            letter-spacing: 4px;
        }

    }
</style>


<script>

    let elapsedSeconds = 0;

    let timerInterval = null;

    let running = false;


    const timerDisplay =
        document.getElementById("timerDisplay");

    const startButton =
        document.getElementById("startButton");

    const pauseButton =
        document.getElementById("pauseButton");

    const resetButton =
        document.getElementById("resetButton");


    function updateDisplay() {

        const hours =
            Math.floor(elapsedSeconds / 3600);

        const minutes =
            Math.floor(
                (elapsedSeconds % 3600) / 60
            );

        const seconds =
            elapsedSeconds % 60;


        timerDisplay.textContent =
            String(hours).padStart(2, "0")
            + ":"
            + String(minutes).padStart(2, "0")
            + ":"
            + String(seconds).padStart(2, "0");
    }


    function startTimer() {

        if (running) {
            return;
        }

        running = true;

        timerInterval = setInterval(() => {

            elapsedSeconds++;

            updateDisplay();

        }, 1000);
    }


    function pauseTimer() {

        running = false;

        clearInterval(timerInterval);

        timerInterval = null;
    }


    function resetTimer() {

        pauseTimer();

        elapsedSeconds = 0;

        updateDisplay();
    }


    startButton.addEventListener(
        "click",
        startTimer
    );


    pauseButton.addEventListener(
        "click",
        pauseTimer
    );


    resetButton.addEventListener(
        "click",
        resetTimer
    );


    updateDisplay();

</script>

{% endblock %}
