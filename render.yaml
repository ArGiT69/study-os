services:

  - type: web

    name: study-os

    runtime: python

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn app:app

    envVars:

      - key: PYTHON_VERSION
        value: 3.13

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: study-os-db
          property: connectionString


databases:

  - name: study-os-db